# Two macOS questions, asked directly of real runners on both architectures:
# can anything in Bun 1.3.14 move the 8 KiB unix-socket short-write
# threshold recorded in packages/werk-poc/findings/platforms.md, and what
# signing state is a fresh `bun build --compile` binary in. The probe script
# prints one `PROBE <name>: <verdict>` line per check and never fails the
# job; the answers are the point, so they are copied into the step summary.
#
# It runs on every push to the spike branch, and only there.
name: macos-probes

on:
  push:
    branches: [spike/macos-probes]

concurrency:
  group: macos-probes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probes:
    name: probes on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Machine
        run: |
          echo "runner: $(uname -sm) macOS $(sw_vers -productVersion)"
          echo "bun: $(bun --version)"
          echo "TMPDIR: $TMPDIR"
          echo "sudo -n: $(sudo -n true 2>&1 && echo ok || echo refused)"
          sysctl net.local.stream.sendspace net.local.stream.recvspace kern.ipc.maxsockbuf

      - name: install
        run: bun install --frozen-lockfile

      - name: build wp
        id: build
        continue-on-error: true
        working-directory: packages/werk-poc
        run: bun run build

      - name: probes
        run: |
          out="$RUNNER_TEMP/probes.txt"
          bun run .github/ci/macos-probes.ts 2>&1 | tee "$out"
          {
            echo "## macos-probes on ${{ matrix.runner }}"
            echo
            echo "\`$(uname -sm)\` macOS $(sw_vers -productVersion), bun $(bun --version), commit \`${GITHUB_SHA:0:8}\`, build step: ${{ steps.build.outcome }}"
            echo
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
