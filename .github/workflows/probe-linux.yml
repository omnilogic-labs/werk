name: probe-linux

on:
  push:
    branches: ["ci/os-linux"]

concurrency:
  group: probe-linux
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: werk-poc on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Environment
        run: |
          echo "CI_OUT_DIR=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"
          set -x
          uname -srm
          bun --version
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"
          nproc; free -m
          for t in vim top tmux jq; do printf '%-6s %s\n' "$t" "$(command -v "$t" || echo absent)"; done
          if ! command -v vim >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq vim
          fi
          (vim --version || true) | head -1
          chmod +x .github/ci/linux.sh
          {
            echo "## werk-poc on ubuntu-latest"
            echo
            echo "| Suite | Result | Time | What ran | Detail |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: install
        id: install
        continue-on-error: true
        timeout-minutes: 10
        run: .github/ci/linux.sh install

      - name: format
        id: format
        continue-on-error: true
        timeout-minutes: 5
        run: .github/ci/linux.sh format

      - name: typecheck
        id: typecheck
        continue-on-error: true
        timeout-minutes: 10
        run: .github/ci/linux.sh typecheck

      - name: test-pure
        id: test-pure
        continue-on-error: true
        timeout-minutes: 10
        run: .github/ci/linux.sh test-pure

      - name: build-web
        id: build-web
        continue-on-error: true
        timeout-minutes: 10
        run: .github/ci/linux.sh build-web

      - name: build
        id: build
        continue-on-error: true
        timeout-minutes: 15
        run: .github/ci/linux.sh build

      - name: test-full
        id: test-full
        continue-on-error: true
        timeout-minutes: 30
        run: .github/ci/linux.sh test-full

      - name: m0
        id: m0
        continue-on-error: true
        timeout-minutes: 20
        run: .github/ci/linux.sh m0

      - name: m2
        id: m2
        continue-on-error: true
        timeout-minutes: 25
        run: .github/ci/linux.sh m2

      - name: m3
        id: m3
        continue-on-error: true
        timeout-minutes: 15
        run: .github/ci/linux.sh m3

      - name: ops
        id: ops
        continue-on-error: true
        timeout-minutes: 15
        run: .github/ci/linux.sh ops

      - name: diff
        id: diff
        continue-on-error: true
        timeout-minutes: 20
        run: .github/ci/linux.sh diff

      - name: experiment m2 slow client
        continue-on-error: true
        timeout-minutes: 20
        working-directory: packages/werk-poc
        run: |
          for i in 1 2 3 4 5; do
            echo "--- plain run $i"
            bun run spikes/m2/run-all.ts "slow client" 2>&1 |
              grep -E '^(PASS|FAIL)  |FAIL:|fast client (never lagged|saw)|slow client: dropped' || true
          done
          for b in 524288 1048576; do
            echo "--- WP_QUEUE_BOUND=$b"
            WP_QUEUE_BOUND=$b bun run spikes/m2/run-all.ts "slow client" 2>&1 |
              grep -E '^(PASS|FAIL)  |FAIL:|fast client (never lagged|saw)|slow client: dropped' || true
          done

      - name: report
        id: report
        if: always()
        continue-on-error: true
        run: .github/ci/linux.sh report

      - name: Upload ci-result-linux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-linux
          path: ${{ runner.temp }}/ci-out
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job when a suite failed
        if: always() && steps.report.outcome != 'success'
        run: |
          echo "at least one suite failed; see the step summary and the ci-result-linux artefact" >&2
          exit 1
