# The two `test-full` tests that pour megabytes through a session, and the
# question underneath them: how fast a session's PTY carries a flood, by
# producer. `.github/ci/step10-flood-probes.ts` prints one `PROBE` line per
# producer, on the Windows runner where the figure in question was taken
# and on the other two so the three sit side by side. Then the two tests,
# each in its own `bun test` process the way the Windows lane runs them,
# with the lane's daemon housekeeping between.
#
# Runs on every push to the step branch. `workflow_dispatch` only works for a
# workflow file that is on the default branch, and this one is not meant to
# reach it.
name: step10-flood-probes

on:
  push:
    branches: [step/10-flood]

concurrency:
  group: step10-flood-probes-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: win32-x64
            runs-on: windows-latest
          - lane: linux-x64
            runs-on: ubuntu-latest
          - lane: darwin-arm64
            runs-on: macos-latest
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Runner
        run: |
          bun --version
          bun -e 'console.log(process.platform, process.arch, require("node:os").release())'
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"

      - name: install
        timeout-minutes: 3
        run: bun install --frozen-lockfile

      - name: build
        timeout-minutes: 8
        working-directory: packages/werk-poc
        run: bun run build

      - name: Flood probes
        timeout-minutes: 15
        run: |
          set -o pipefail
          bun run .github/ci/step10-flood-probes.ts 2>&1 | tee probes.log
          {
            echo "## step10 flood probes — ${{ matrix.lane }}"
            echo
            echo "commit \`${GITHUB_SHA:0:8}\`, bun \`$(bun --version)\`"
            echo
            echo '```'
            tr -d '\r' <probes.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: stop daemons
        if: always()
        run: bun run .github/ci/windows-daemon.ts stop

      - name: daemon.test.ts slow client
        if: always()
        timeout-minutes: 4
        working-directory: packages/werk-poc
        run: |
          set -o pipefail
          bun test src/daemon/daemon.test.ts -t "slow client" 2>&1 | tee "$GITHUB_WORKSPACE/slow-client.log"

      - name: stop daemons
        if: always()
        run: bun run .github/ci/windows-daemon.ts stop

      - name: attach-snapshot.test.ts lagging
        if: always()
        timeout-minutes: 4
        working-directory: packages/werk-poc
        run: |
          set -o pipefail
          bun test src/daemon/attach-snapshot.test.ts -t "lagging" 2>&1 | tee "$GITHUB_WORKSPACE/lagging.log"

      - name: stop daemons
        if: always()
        run: bun run .github/ci/windows-daemon.ts stop

      - name: Verdicts
        if: always()
        run: |
          {
            echo
            echo "## tests — ${{ matrix.lane }}"
            echo
            echo '```'
            tr -d '\r' <slow-client.log | grep -aE '^\(pass\)|^\(fail\)|^slow client|^fast client|^daemon RSS' || true
            tr -d '\r' <lagging.log | grep -aE '^\(pass\)|^\(fail\)|^lagging' || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step10-flood-${{ matrix.lane }}
          path: |
            probes.log
            slow-client.log
            lagging.log
          if-no-files-found: warn
          retention-days: 14
