# Step 3 of docs/proposals/01-cross-platform.md, measured while it is built:
# what ConPTY emits for the same input twice, and which `bun test` file takes
# the Windows run down before the rest of them get to a verdict.
#
# Runs on every push to the step branch. Minutes rather than the poc lane's
# quarter of an hour, because it skips everything that already passes.
name: conpty-oracle

on:
  push:
    branches: [step/03-conpty-oracle]

concurrency:
  group: conpty-oracle
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probes:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Runner
        run: |
          bun --version
          bun -e 'console.log(process.platform, process.arch, require("node:os").release())'
          bun install --frozen-lockfile

      - name: ConPTY probes
        timeout-minutes: 6
        run: |
          set -o pipefail
          bun run .github/ci/windows-probes.ts conpty 2>&1 | tee conpty.log
          {
            echo "## conpty probes"
            echo
            echo '```'
            tr -d '\r' <conpty.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Which test in `daemon.test.ts` takes the process down: the whole file,
      # then the file without the one test that times out. If the second run
      # reaches a verdict, the panic belongs to the timeout rather than to
      # anything the other tests do.
      - name: daemon.test.ts, with and without the test that times out
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        working-directory: packages/werk-poc
        run: |
          set +e
          echo "::group::whole file"
          timeout 120 bun test src/daemon/daemon.test.ts 2>&1 | tr -d '\r'
          echo "whole file: exit ${PIPESTATUS[0]}"
          echo "::endgroup::"
          bun run "$GITHUB_WORKSPACE/.github/ci/windows-daemon.ts" stop
          echo "::group::without the kill test"
          timeout 120 bun test src/daemon/daemon.test.ts \
            -t '^(?!.*kill signals the child)' 2>&1 | tr -d '\r'
          echo "without the kill test: exit ${PIPESTATUS[0]}"
          echo "::endgroup::"

      # `bun test` on the windows lane dies partway through and loses every
      # file after it. The lane's own script runs one process per file; this
      # is that script, so the lane and the probe run agree.
      - name: test-full, one file at a time
        if: always()
        continue-on-error: true
        timeout-minutes: 16
        working-directory: packages/werk-poc
        run: bash "$GITHUB_WORKSPACE/.github/ci/windows-test-full.sh"
