# The `spike/win32-daemon` experiment: probe the primitives the daemon layer
# would need on Windows, on a real runner, before and while porting it.
#
# Runs on every push to the spike branch. `workflow_dispatch` is not offered
# because it only works for a workflow file that is on the default branch,
# and this one is not meant to reach it.
name: win32-spike

on:
  push:
    branches: [spike/win32-daemon]

concurrency:
  group: win32-spike
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probes:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Runner
        run: |
          bun --version
          bun -e 'console.log(process.platform, process.arch, require("node:os").release())'
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"

      - name: Probes
        timeout-minutes: 12
        run: |
          set -o pipefail
          bun run .github/ci/win32-spike-probes.ts 2>&1 | tee probes.log
          {
            echo "## win32-spike probes"
            echo
            echo "commit \`${GITHUB_SHA:0:8}\`, bun \`$(bun --version)\`"
            echo
            echo '```'
            tr -d '\r' <probes.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload probes.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-spike-probes
          path: probes.log
          if-no-files-found: warn
          retention-days: 14
