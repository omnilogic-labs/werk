# Step 10's lifecycle unit, measured on both Windows runners on every push
# to its branch: the two `test-full` tests about how a process ends, each in
# a `bun test` process of its own with a daemon stop between them as the
# lane runs them, and a probe script that asks what can stop a detached
# daemon from outside the protocol and why an exited session's attach saw
# output before its snapshot.
#
# `workflow_dispatch` only works for a workflow file on the default branch,
# and this one is not meant to reach it.
name: step10-lifecycle-probes

on:
  push:
    branches: [step/10-lifecycle]

concurrency:
  group: step10-lifecycle-probes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: win32-x64
            runs-on: windows-latest
          - lane: win32-arm64
            runs-on: windows-11-arm
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Runner
        run: |
          bun --version
          bun -e 'console.log(process.platform, process.arch, require("node:os").release())'
          echo "ImageOS=${ImageOS:-} ImageVersion=${ImageVersion:-}"

      - name: install
        timeout-minutes: 3
        run: bun install --frozen-lockfile

      # The tests spawn the daemon from source; the build is here so the
      # lane's shape is the same. A build that fails is not this unit's.
      - name: build
        continue-on-error: true
        timeout-minutes: 8
        working-directory: packages/werk-poc
        run: bun run build

      - name: snapshot.test.ts
        continue-on-error: true
        timeout-minutes: 4
        working-directory: packages/werk-poc
        run: |
          set -o pipefail
          timeout -k 15 180 bun test src/daemon/snapshot.test.ts 2>&1 | tr -d '\r' | tee "$GITHUB_WORKSPACE/snapshot.log"

      - name: stop daemons
        if: always()
        timeout-minutes: 2
        working-directory: packages/werk-poc
        run: bun run "$GITHUB_WORKSPACE/.github/ci/windows-daemon.ts" stop

      - name: attach-snapshot.test.ts (exited session)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        working-directory: packages/werk-poc
        run: |
          set -o pipefail
          timeout -k 15 180 bun test src/daemon/attach-snapshot.test.ts -t "exited session" 2>&1 | tr -d '\r' | tee "$GITHUB_WORKSPACE/attach.log"

      - name: stop daemons
        if: always()
        timeout-minutes: 2
        working-directory: packages/werk-poc
        run: bun run "$GITHUB_WORKSPACE/.github/ci/windows-daemon.ts" stop

      - name: Lifecycle probes
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -o pipefail
          timeout -k 15 420 bun run .github/ci/step10-lifecycle-probes.ts 2>&1 | tr -d '\r' | tee probes.log

      - name: stop daemons
        if: always()
        timeout-minutes: 2
        working-directory: packages/werk-poc
        run: bun run "$GITHUB_WORKSPACE/.github/ci/windows-daemon.ts" stop

      - name: Summary
        if: always()
        run: |
          {
            echo "## step10 lifecycle — ${{ matrix.lane }}"
            echo
            echo "commit \`${GITHUB_SHA:0:8}\`, bun \`$(bun --version)\`"
            echo
            echo '```'
            grep -aE '^\(pass\)|^\(fail\)|^ *[0-9]+ (pass|fail)$|^PROBE' snapshot.log attach.log probes.log 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "--- verdicts ---"
          grep -aE '^\(pass\)|^\(fail\)|^PROBE' snapshot.log attach.log probes.log 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step10-lifecycle-${{ matrix.lane }}
          path: |
            snapshot.log
            attach.log
            probes.log
          if-no-files-found: warn
          retention-days: 14
