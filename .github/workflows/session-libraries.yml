name: Session libraries
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Steady/churn duration (60 to 86400 seconds)"
        default: "86400"
        required: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun test packages/session-daemon/test/native.test.ts
      - run: bun run test:artefacts
      - run: bun run test:soak
        env:
          SOAK_SECONDS: "60"
          SOAK_REPORT: soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: soak.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: examples/session-web
      - run: bun run test:browser
  soak:
    if: github.event_name == 'workflow_dispatch'
    # Hosted runners cap jobs at six hours; a day needs an owned runner.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:soak
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          SOAK_REPORT: soak.json
          SOAK_BASELINE: docs/session-library/linux-x64-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-soak
          path: soak.json
