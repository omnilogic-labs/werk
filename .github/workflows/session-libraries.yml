name: CI
on:
  push:
    branches: [main]
  # A branch reaches CI through its pull request or through a dispatch, so a
  # bare push of a feature branch starts nothing.
  pull_request:
  workflow_dispatch:
    inputs:
      lanes:
        description: "Which lanes to run"
        type: choice
        options: [all, linux, macos, windows, musl, browser, soak]
        default: all
      soak_seconds:
        description: "Steady/churn duration for the soak lane (60 to 86400 seconds)"
        default: "86400"
        required: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.lanes }}
  cancel-in-progress: true
env:
  BUN_VERSION: "1.3.14"
# Windows steps run under Git Bash rather than pwsh, so one `run:` body is
# correct on all three platforms. The Alpine container has no bash until its
# first step installs one, which is why that step names `sh` explicitly.
defaults:
  run:
    shell: bash
jobs:
  # Steps are ordered cheapest first so a run dies on the first failure with
  # the least spent: formatting, then the static gates, then unit tests, then
  # the integration ones. `--bail` carries the same idea inside a test step,
  # and `--retry=2` gives a test three attempts before it counts as failed, so
  # a flake does not read as a broken build.
  native:
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","linux","macos","windows"]'), inputs.lanes)
    strategy:
      # Left off deliberately: one platform's failure should not cancel the
      # evidence the other two were about to produce.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.lanes == 'linux' && '["ubuntu-latest"]' || inputs.lanes == 'macos' && '["macos-latest"]' || inputs.lanes == 'windows' && '["windows-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Linux only: there is no `.gitattributes`, so a Windows checkout is
      # most likely CRLF and would fail the check on line endings alone.
      - run: bun run format:check
        if: matrix.os == 'ubuntu-latest'
      - run: bun run build
      - run: bun run typecheck
      - run: bun test scripts --bail
      - run: bun run test --retry=2 --bail
      - run: bun run test:artefacts
      - run: bun run test:soak
        env:
          SOAK_SECONDS: "60"
          SOAK_REPORT: soak.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.os }}
          path: soak.json
  # musl Linux x64, in an Alpine job container. The daemon lock is the reason
  # this lane exists: `bun:ffi` has to find a libc there, and a compiled binary
  # has to find one too. It says nothing about glibc, macOS or Windows, which
  # the `native` matrix covers.
  musl:
    if: github.event_name != 'workflow_dispatch' || inputs.lanes == 'all' || inputs.lanes == 'musl'
    runs-on: ubuntu-24.04
    container: alpine:3.22
    timeout-minutes: 30
    steps:
      # busybox only to start with. `libstdc++` and `libgcc` are not a
      # convenience: the musl Bun and everything compiled from it link against
      # `libstdc++.so.6` and `libgcc_s.so.1`. `procps` provides the `ps` the
      # native tests read process state from.
      - name: apk add
        shell: sh
        run: |
          apk add --no-cache bash git coreutils procps libstdc++ libgcc \
            musl-utils ncurses ncurses-terminfo-base jq curl unzip
          cat /etc/alpine-release
      - uses: actions/checkout@v4
      # setup-bun picks the glibc build on Alpine; replace it with the musl zip
      # when the one it installed cannot run.
      - uses: oven-sh/setup-bun@v2
        id: setup-bun
        continue-on-error: true
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun (musl)
        run: |
          if bun --version 2>/dev/null | grep -qx "$BUN_VERSION" && bun -e 'process.exit(0)' 2>/dev/null; then
            echo "using setup-bun (outcome ${{ steps.setup-bun.outcome }})"
          else
            curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64-musl.zip"
            unzip -q -o /tmp/bun.zip -d /tmp/bun
            install -m 0755 /tmp/bun/*/bun /usr/local/bin/bun
            echo "/usr/local/bin" >>"$GITHUB_PATH"
          fi
      - name: libc
        run: |
          command -v bun; bun --version
          ldd "$(command -v bun)" || true
      - run: bun install --frozen-lockfile
      # `build` comes before `typecheck` because `packages/terminal-beamterm`
      # imports `@werk/terminal` from `dist/`, so a typecheck from a clean tree
      # cannot resolve it.
      - run: bun run build
      # The interpreted tests below load libc through `bun:ffi` in the Bun
      # process. A compiled binary resolves it through the same system loader,
      # which is the case the research note could not confirm, so ask the built
      # CLI which mechanism it would use. It is the point of the lane and it
      # costs about a second, so it runs before the slower gates.
      - name: compiled lock mechanism
        run: |
          packages/werk/dist/werk info --json | tee /tmp/info.json
          test "$(jq -r .lockMechanism /tmp/info.json)" = flock
      - run: bun run typecheck
      - run: bun test packages/session-daemon/test/native.test.ts packages/session-daemon/test/hardening.test.ts --retry=2 --bail
  browser:
    if: github.event_name != 'workflow_dispatch' || inputs.lanes == 'all' || inputs.lanes == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: examples/session-web
      - run: bun run test:browser --retry=2 --bail
  soak:
    # A day-long run is asked for by name, so an ad-hoc dispatch of the other
    # lanes does not start one.
    if: github.event_name == 'workflow_dispatch' && inputs.lanes == 'soak'
    # Hosted runners cap jobs at six hours; a day needs an owned runner.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:soak
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          SOAK_REPORT: soak.json
          SOAK_BASELINE: docs/session-library/linux-x64-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-soak
          path: soak.json
