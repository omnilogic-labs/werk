# What the werk proof of concept does, and where it stops, on windows-latest.
#
# The proof of concept is POSIX-only by construction, so most of this job is
# expected to be red. That is the point: every suite runs, every suite records
# its own verdict, and the job never stops at the first failure, so one run
# produces the whole cascade with the real error text at each layer.
name: probe-windows

on:
  push:
    branches: ["ci/os-windows"]

concurrency:
  group: probe-windows
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SUITE_TIMEOUT: "300"
  SUITE_ORDER: >-
    install typecheck test-pure build-web build wp-cli diff test-full m0 m2 m3
    ops probes daemon
  # The suites that pass on windows today. Everything else is expected to
  # fail and is recorded rather than gated, so a red gate means one of these
  # regressed rather than "windows still does not run the daemon". `m3` is
  # deliberately not here: every snapshot it encodes decodes identically, but
  # on one run in four the process printed all of its tables and then did not
  # exit, so gating on it would gate on that.
  EXPECTED_PASS: install typecheck build-web build diff probes

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      # Git for Windows checks out with CRLF by default, which would rewrite
      # the .cast corpus fixtures and every source file before anything ran.
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Record the runner
        id: runner
        run: |
          set -euo pipefail
          echo "SUITE_DIR=$RUNNER_TEMP/suites" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/suites"
          rel=$(bun -e 'console.log(require("node:os").release())')
          echo "PROBE_RUNNER=$RUNNER_ARCH/$RUNNER_OS ${ImageOS:-?} ${ImageVersion:-?} nt-$rel" >>"$GITHUB_ENV"
          bun --version
          bun -e 'console.log(process.platform, process.arch, process.execPath)'
          {
            echo "## probe-windows"
            echo
            echo "runner: \`$RUNNER_ARCH/$RUNNER_OS ${ImageOS:-?} ${ImageVersion:-?} nt-$rel\`"
            echo "bun: \`$(bun --version)\`  commit: \`$GITHUB_SHA\`"
            echo
            echo "| suite | status | ms | detail |"
            echo "| --- | --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"

      # 1 — dependencies. Frozen lockfile, at the repo root, as the workspace
      # needs. Expected to pass: nothing here is platform-specific.
      - name: install
        id: install
        continue-on-error: true
        run: bash .github/ci/windows.sh install . 'bun install --frozen-lockfile'

      # 2 — types. POSIX-agnostic; expected to pass.
      - name: typecheck
        id: typecheck
        continue-on-error: true
        run: bash .github/ci/windows.sh typecheck packages/werk-poc 'bun run typecheck'

      # 3 — the pure-computation tests: the VT engines, the capability matrix
      # and the wire protocol. No PTY, no socket, no ffi.
      - name: test-pure
        id: test-pure
        continue-on-error: true
        run: bash .github/ci/windows.sh test-pure packages/werk-poc 'bun test src/engine src/protocol'

      # 4 — the web bundle. Pure Bun.build.
      - name: build-web
        id: build-web
        continue-on-error: true
        run: bash .github/ci/windows.sh build-web packages/werk-poc 'bun run build:web'

      # 5 — the single-file binary, and what it can say without a daemon.
      - name: build
        id: build
        continue-on-error: true
        run: |
          bash .github/ci/windows.sh build packages/werk-poc \
            'bun run build && ls -l dist && WP=dist/wp.exe && test -f "$WP" || WP=dist/wp && echo "binary: $WP" && "./$WP" --help && echo "--- caps ---" && "./$WP" caps'

      # 5b — the compiled binary talking to a daemon it has to start itself.
      - name: wp-cli
        id: wp-cli
        continue-on-error: true
        env:
          SUITE_TIMEOUT: "90"
        run: |
          bash .github/ci/windows.sh wp-cli packages/werk-poc \
            'WP=dist/wp.exe && test -f "$WP" || WP=dist/wp && "./$WP" ls'

      # 6 — the differential corpus, plus 200 fuzz iterations on a fixed seed
      # so the numbers can be held against the same command on linux.
      # ghostty-ffi will not load, but the wasm engine and the xterm oracle
      # should both be here; whether they agree is the most interesting
      # question this job can answer.
      - name: diff
        id: diff
        continue-on-error: true
        env:
          SUITE_TIMEOUT: "600"
        run: |
          bash .github/ci/windows.sh diff packages/werk-poc \
            'bun run bench/differential.ts --fuzz 200 --seed 7'

      # 7 — the whole test suite, PTY and daemon included.
      - name: test-full
        id: test-full
        continue-on-error: true
        run: |
          bash .github/ci/windows.sh test-full packages/werk-poc \
            'bun test >full.log 2>&1; rc=$?; cat full.log; echo "--- files and failures ---"; grep -a "^::group::\|^(fail)" full.log; exit $rc'

      # 8..10 — the spikes. Each M0 probe carries its own deadline of 15-90 s;
      # the runner's cap has to sit above the longest of them (07-latency does
      # 2,000 PTY round trips and takes about a minute here) or a probe that
      # would have passed is scored as a hang. `run-all.ts` exits 0 whatever
      # the probes did, so the table it prints is what decides the verdict,
      # and its summaries are echoed last so one of them becomes the detail.
      - name: m0
        id: m0
        continue-on-error: true
        env:
          SUITE_TIMEOUT: "2700"
        run: |
          bash .github/ci/windows.sh m0 packages/werk-poc \
            'timeout -k 15 2600 bun run ./spikes/m0/run-all.ts --timeout 90000 >m0.log 2>&1; rc=$?; cat m0.log; echo "--- per-probe logs ---"; for f in dist/m0/*/*.log; do echo "===== $f"; cat "$f"; done; bad=$(grep -aE "^\| 0[0-9]-" m0.log | grep -aE "fail|hung|crash|build-failed" | cut -d"|" -f2 | tr -d " " | tr "\n" " "); test -z "$bad" || rc=1; echo "m0 probes not passing: ${bad:-none}"; exit $rc'

      - name: m2
        id: m2
        continue-on-error: true
        run: bash .github/ci/windows.sh m2 packages/werk-poc 'bun run m2'

      - name: m3
        id: m3
        continue-on-error: true
        run: bash .github/ci/windows.sh m3 packages/werk-poc 'bun run m3'

      # 11 — the operational report: toolchain, platform matrix, cold start.
      - name: ops
        id: ops
        continue-on-error: true
        run: bash .github/ci/windows.sh ops packages/werk-poc 'bun run bench/ops.ts --quick --no-compile'

      # 12 — direct probes of the primitives underneath all of the above, so
      # the cascade can be attributed to a layer rather than inferred.
      - name: probes
        id: probes
        continue-on-error: true
        env:
          SUITE_TIMEOUT: "120"
        run: bash .github/ci/windows.sh probes . 'bun run .github/ci/windows-probes.ts'

      # 13 — the daemon, started the way `wp` starts it.
      - name: daemon
        id: daemon
        continue-on-error: true
        env:
          SUITE_TIMEOUT: "60"
        run: bash .github/ci/windows.sh daemon packages/werk-poc 'bun run src/cli/main.ts __daemon'

      - name: Collect
        if: always()
        run: |
          set -euo pipefail
          bun run .github/ci/windows-collect.ts
          mkdir -p suite-logs
          cp "$SUITE_DIR"/*.log suite-logs/ 2>/dev/null || true
          {
            echo
            echo '<details><summary>ci-result-windows.json</summary>'
            echo
            echo '```json'
            cat ci-result-windows.json
            echo '```'
            echo
            echo '</details>'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-result-windows
          path: |
            ci-result-windows.json
            suite-logs/
          if-no-files-found: warn

      # The job's own verdict, after the report is safely uploaded: green over
      # the subset that works on windows, red only when part of that subset
      # stops working. The rest of the cascade is the finding, not a failure.
      - name: Gate
        if: always()
        run: |
          set -uo pipefail
          rc=0
          for id in $EXPECTED_PASS; do
            s=$(cat "$SUITE_DIR/$id.status" 2>/dev/null || echo missing)
            if [ "$s" = pass ]; then
              echo "ok      $id"
            else
              echo "::error::$id is expected to pass on windows and did not ($s)"
              rc=1
            fi
          done
          for id in $SUITE_ORDER; do
            case " $EXPECTED_PASS " in
              *" $id "*) continue ;;
            esac
            echo "known   $id: $(cat "$SUITE_DIR/$id.status" 2>/dev/null || echo missing)"
          done
          exit $rc
